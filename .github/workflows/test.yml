name: Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Bun test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
          no-cache: true
          token: ''
      - name: Test with mocked external network
        # No dependency install is needed for the default zero-dependency suite.
        # Five optional Postgres integration tests retain their explicit skips.
        run: bun test --preload ./.github/ci/offline-preload.js tests/
