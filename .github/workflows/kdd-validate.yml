name: kdd-validate

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11 (KDD validator tooling only)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Validate task contracts (Nivel 1)
        run: python scripts/validate_contracts.py knowledge/contracts

      - name: Validate execution contracts / specs (Nivel 1)
        run: python scripts/validate_specs.py specs

      - name: Validate OKF knowledge nodes (Nivel 1)
        run: python scripts/validate_okf.py knowledge

      - name: Lint ASCII in vendored scripts (Nivel 1)
        run: python scripts/lint_ascii.py scripts

      - name: Validate rule contracts (Nivel 1, opcional)
        run: python scripts/validate_rules.py examples/rules

      - name: Validate agent skills (Nivel 1, opcional)
        run: python scripts/validate_skills.py skills .agents/skills

      - name: Validate changelog coherence (Nivel 1, opcional)
        run: python scripts/validate_changelog.py

      - name: Validate UX/accessibility pages (Nivel 1, opcional)
        run: python scripts/validate_ux_page.py examples/ux-page

      - name: Validate Mermaid diagrams (Nivel 1, opcional)
        run: python scripts/validate_diagrams.py examples/diagrams

      - name: Validate security findings (Capa 3, opcional)
        run: python scripts/validate_security_findings.py security/scan

      - name: Validate compliance/license findings (Capa 3, opcional)
        run: python scripts/validate_compliance_findings.py compliance/scan

      - name: Validate privacy/PII findings (Capa 3, opcional)
        run: python scripts/validate_privacy_findings.py privacy/scan

      - name: Validate accessibility findings (Capa 3, opcional)
        run: python scripts/validate_accessibility_findings.py accessibility/scan

      - name: Validate dependency EOL findings (Capa 3, opcional)
        run: python scripts/validate_dependency_eol_findings.py dependency-eol/scan

      - name: Validate observability findings (Capa 3, opcional)
        run: python scripts/validate_observability_findings.py observability/scan

      - name: Validate test-coverage findings (Capa 3, opcional)
        run: python scripts/validate_test_coverage_findings.py test-coverage/scan

      - name: Run each contract's test_command (Nivel 1)
        run: python scripts/validate_test_commands.py knowledge/contracts .

      - name: Scan for leaked secrets (Nivel 1, opcional)
        run: python scripts/scan_secrets.py core adapters routes

      # Nivel 2 (the real CCDD complexity/integration gate, via the
      # ccdd-complexity MCP server) is NOT run here -- GitHub Actions has no
      # MCP session. It was verified manually, once, for this contract; see
      # knowledge/contracts/is-valid-semver.md and .agents/logs/ (local,
      # gitignored). Automatic ongoing Nivel 2 enforcement is not yet wired.

      - name: Run automators-kit test suite (1/2)
        run: bun test tests/

      - name: Run automators-kit test suite (2/2)
        run: bun test tests/
